name: Bug report
description: Report a reproducible export or interface issue without private data.
body:
  - type: markdown
    attributes:
      value: "Never include API tokens, personal exports, private messages, or browser session data. Issues are public."
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 1.4.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser version and operating system
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source
      options: [Server channel, Direct message, Bulk channels, Other]
  - type: dropdown
    id: format
    attributes:
      label: File format
      options: [JSON, CSV, TXT, Not applicable]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and expected behavior
      description: Use synthetic names and messages. Describe date settings if relevant.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Visible error or redacted screenshot
      description: Remove tokens, channel identifiers, names, and private content before attaching anything.
