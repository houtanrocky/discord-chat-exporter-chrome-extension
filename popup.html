<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css" />
  <title>Discord Chat Exporter</title>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.04 2 11c0 1.8.7 3.45 1.83 4.78l-1.12 3.34 3.9-1.52C7.5 18.5 9.68 19 12 19c5.52 0 10-4.04 10-9S17.52 2 12 2z" fill="#5865F2"/>
          <circle cx="8" cy="10" r="1.5" fill="white"/>
          <circle cx="12" cy="10" r="1.5" fill="white"/>
          <circle cx="16" cy="10" r="1.5" fill="white"/>
        </svg>
        <span class="app-title">Discord Chat Export Tool</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content">
      <!-- Warning banner -->
      <div id="notDiscordWarning" class="warning-banner" style="display:none;">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5.99 19.53 19H4.47L12 5.99M12 2 1 21h22L12 2zm1 14h-2v2h2v-2zm0-6h-2v4h2v-4z"/></svg>
        <p>Not a Discord page – please open a channel first.</p>
      </div>

      <!-- Preview Card -->
      <div class="preview-card" id="previewCard">
        <div class="preview-avatar" id="previewAvatar"></div>
        <div class="preview-info">
          <span class="preview-guild" id="previewGuildName">Select a guild</span>
          <span class="preview-channel" id="previewChannelName">Select a channel</span>
        </div>
      </div>

      <!-- Form -->
      <form id="exportForm" class="export-form">
        <!-- Mode Selector -->
        <div class="field">
          <label for="modeSelect">Export from</label>
          <select id="modeSelect">
            <option value="guild">Server (Guild)</option>
            <option value="dm">Direct Messages</option>
          </select>
        </div>

        <!-- Guild Select (shown in guild mode) -->
        <div class="field" id="guildField">
          <label for="guildSelect">Guild (Server)</label>
          <select id="guildSelect"></select>
        </div>

        <!-- Channel Select (shown in both modes, but populated differently) -->
        <div class="field" id="channelField">
          <label for="channelSelect">Channel</label>
          <select id="channelSelect"></select>
        </div>

        <!-- Token input -->
        <div class="field">
          <label for="tokenInput">Discord Token</label>
          <input type="password" id="tokenInput" placeholder="Paste raw token (e.g., MTExN...)" />
          <small>Copy the 'authorization' header from DevTools (without 'Bearer ').</small>
        </div>

        <!-- Date range -->
        <div class="date-row">
          <div class="field flex-1">
            <label for="afterDate">Start Date</label>
            <input type="date" id="afterDate" />
          </div>
          <div class="field flex-1">
            <label for="beforeDate">End Date</label>
            <input type="date" id="beforeDate" />
          </div>
        </div>

        <!-- All Time checkbox -->
        <div class="field checkbox">
          <label>
            <input type="checkbox" id="allTime" />
            All Time (auto-detect full channel history)
          </label>
        </div>

        <!-- Export all channels checkbox -->
        <div class="field checkbox">
          <label>
            <input type="checkbox" id="allChannels" />
            Export all text channels in this guild / all DMs
          </label>
        </div>

        <!-- Format -->
        <div class="field">
          <label for="formatSelect">Format</label>
          <select id="formatSelect">
            <option value="json">JSON (analysis)</option>
            <option value="csv">CSV</option>
            <option value="plaintext">Plain Text</option>
          </select>
        </div>

        <button type="submit" class="export-btn" id="exportBtn">Start Exporting</button>
      </form>

      <!-- Progress area -->
      <div id="progressArea" class="progress-area" style="display:none;">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="progress-status" id="progressStatus">Initializing...</div>
        <div class="progress-detail" id="progressDetail"></div>
        <button id="cancelBtn" class="cancel-btn" style="display:none;">Cancel</button>
      </div>

      <!-- Status message -->
      <div id="status" class="status-message"></div>
    </div>

    <div class="footer">v1.3.0</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
