<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exporting - Discord Chat Exporter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fbfbfd;
      color: #1d1d1f;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subtitle {
      color: #6e6e73;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .preview {
      background: #f5f5f7;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .preview .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #5865F2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 18px;
      flex-shrink: 0;
    }
    .preview .info {
      flex: 1;
    }
    .preview .guild {
      font-weight: 500;
    }
    .preview .channel {
      font-size: 13px;
      color: #6e6e73;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #e5e5ea;
      border-radius: 4px;
      overflow: hidden;
      margin: 16px 0 8px;
    }
    .progress-bar-fill {
      height: 100%;
      background: #007aff;
      border-radius: 4px;
      transition: width 0.3s ease;
      width: 0%;
    }
    .status-text {
      font-weight: 500;
      font-size: 15px;
    }
    .detail-text {
      color: #6e6e73;
      font-size: 13px;
      margin-top: 4px;
    }
    .actions {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #007aff;
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: #0066d9;
    }
    .btn-danger {
      background: #ff3b30;
      color: white;
    }
    .btn-danger:hover:not(:disabled) {
      background: #d63031;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #e5e5ea;
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #8e8e93;
      border-top: 1px solid #e5e5ea;
      padding-top: 16px;
      text-align: center;
    }
    .error {
      color: #ff3b30;
    }
    .complete {
      color: #34c759;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <h1>
    <img src='./icons/icon32.png' alt="" />
    Export in progress
  </h1>
  <div class="subtitle">Your chat data is being exported. You can close this tab and the export will continue in the background.</div>

  <!-- Preview -->
  <div class="preview" id="preview">
    <div class="avatar" id="avatar">?</div>
    <div class="info">
      <div class="guild" id="guildName">Guild</div>
      <div class="channel" id="channelName">Channel</div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>
  <div class="status-text" id="statusText">Initializing...</div>
  <div class="detail-text" id="detailText"></div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-danger" id="cancelBtn">Cancel Export</button>
    <button class="btn btn-secondary hidden" id="closeBtn">Close Tab</button>
    <button class="btn btn-primary hidden" id="retryBtn">Retry</button>
  </div>

  <div class="footer">Discord Chat Exporter v1.4.0</div>
</div>
<script type="module" src="./index.js"></script>
</body>
</html>
